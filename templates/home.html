<!DOCTYPE html>
<html>

<head>

<title>Student Performance Predictor</title>

<style>

body{

    margin:0;
    padding:20px;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(to right,#667eea,#764ba2);

}


.container{

    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0px 0px 25px rgba(0,0,0,0.3);

}


h1{

    text-align:center;
    color:#333;

}


label{

    font-weight:bold;
    display:block;
    margin-top:15px;

}


select,input{

    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:1px solid lightgray;
    box-sizing:border-box;
    font-size:15px;

}


select:hover,
input:hover{

    border:2px solid #764ba2;

}


.btn{

    width:100%;
    padding:15px;
    margin-top:25px;
    background:#764ba2;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
    transition:0.3s;

}


.btn:hover{

    background:#667eea;
    transform:scale(1.02);

}


.result{

    margin-top:25px;
    padding:20px;
    background:#d4edda;
    border-radius:10px;
    text-align:center;
    font-size:22px;
    color:#155724;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="container">

<h1>Student Exam Performance Predictor</h1>

<form action="{{ url_for('predict_datapoint') }}" method="post">

<label>Gender</label>

<select name="gender" required>

<option disabled selected>Select Gender</option>
<option value="male">Male</option>
<option value="female">Female</option>

</select>



<label>Race / Ethnicity</label>

<select name="race_ethnicity" required>

<option disabled selected>Select Group</option>
<option value="group A">Group A</option>
<option value="group B">Group B</option>
<option value="group C">Group C</option>
<option value="group D">Group D</option>
<option value="group E">Group E</option>

</select>



<label>Parental Level of Education</label>

<select name="parental_level_of_education" required>

<option disabled selected>Select Education</option>

<option value="associate's degree">Associate's Degree</option>
<option value="bachelor's degree">Bachelor's Degree</option>
<option value="high school">High School</option>
<option value="master's degree">Master's Degree</option>
<option value="some college">Some College</option>
<option value="some high school">Some High School</option>

</select>



<label>Lunch Type</label>

<select name="lunch" required>

<option disabled selected>Select Lunch Type</option>
<option value="free/reduced">Free / Reduced</option>
<option value="standard">Standard</option>

</select>



<label>Test Preparation Course</label>

<select name="test_preparation_course" required>

<option disabled selected>Select Course Status</option>
<option value="none">None</option>
<option value="completed">Completed</option>

</select>



<label>Reading Score</label>

<input
type="number"
name="reading_score"
min="0"
max="100"
placeholder="Enter Reading Score"
required>



<label>Writing Score</label>

<input
type="number"
name="writing_score"
min="0"
max="100"
placeholder="Enter Writing Score"
required>



<button class="btn" type="submit">

Predict Maths Score

</button>

</form>


{% if results %}

<div class="result">

Predicted Maths Score = {{ results }}

</div>

{% endif %}


</div>

</body>

</html>
